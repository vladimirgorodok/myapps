<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>Мои приложения — MyApps</title>
<style>
:root{--p:#6366f1;--pd:#4f46e5;--bg:#0f0f23;--c:#1a1a2e;--c2:#22223d;--t:#e8e8f0;--t2:#8a8ab0;--g:#22c55e;--r:#ef4444;--bl:#3b82f6;--b:#3a3a5a;--hd:#c7c9ff;--inp:#2a2a4a;--upd:#2b2a5a}
:root[data-theme="light"]{--bg:#f4f5fb;--c:#ffffff;--c2:#eef0fa;--t:#1d1d2b;--t2:#5d6080;--b:#d6d9ea;--hd:#3b3d9a;--inp:#ffffff;--upd:#e9e8ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
#sp{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#sp.h{opacity:0;pointer-events:none}
#sp .lg{font-size:4rem;animation:pu 1.4s ease-in-out infinite}
#sp .ti{margin-top:.6rem;font-size:1.5rem;font-weight:700;color:#c7c9ff;letter-spacing:.1em}
#sp .sn{width:40px;height:40px;margin-top:1.5rem;border:3px solid rgba(99,102,241,.3);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.app{display:none}.app.v{display:block}
header{padding:.8rem 1rem;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
header h1{font-size:1.2rem;color:var(--hd)}
header p{font-size:.75rem;color:var(--t2);margin-top:.2rem}
.hb{display:flex;gap:.4rem;flex-wrap:nowrap}
.btn{padding:.4rem .7rem;border:none;border-radius:6px;font-size:.78rem;cursor:pointer;color:#fff;white-space:nowrap}
.bp{background:var(--p)}.bg{background:var(--g)}.bb{background:var(--bl)}.br{background:var(--r)}.bv{background:var(--b);color:var(--t)}
.btn:disabled{opacity:.5}
.tabs{padding:.5rem 1rem;display:flex;flex-wrap:wrap;gap:.3rem;border-bottom:1px solid var(--b)}
.tb{padding:.35rem .75rem;background:transparent;border:1px solid var(--b);color:var(--t2);border-radius:16px;font-size:.75rem;cursor:pointer}
.tb.a{background:var(--p);border-color:var(--p);color:#fff}
.srch{padding:.5rem 1rem .25rem}
.flt{display:flex;gap:.5rem;flex-wrap:wrap;padding:0 1rem .5rem;align-items:center}
.flt label{font-size:.75rem;color:var(--t2)}
.flt select,td select{padding:.35rem .5rem;background:var(--inp);border:1px solid var(--b);border-radius:6px;color:var(--t);font-size:.8rem}
.srch input{width:100%;padding:.5rem .8rem;background:var(--inp);border:1px solid var(--b);border-radius:16px;color:var(--t);font-size:.85rem;outline:none}
.upd{margin:.5rem 1rem 0;padding:.6rem .8rem;background:var(--upd);border:1px solid var(--p);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.wrap{overflow-x:auto;padding:.5rem 1rem 1.5rem}
table{width:100%;border-collapse:collapse;background:var(--c);border:1px solid var(--b);border-radius:8px}
th,td{padding:.5rem .6rem;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle;font-size:.8rem;white-space:nowrap}
th{background:var(--c2);color:var(--t2);font-weight:600;white-space:normal;line-height:1.25}
tr:last-child td{border-bottom:none}
.nm{font-weight:600}
.bd{padding:.1rem .4rem;border-radius:4px;font-size:.68rem;font-weight:700;color:#fff;margin-left:.3rem}
.bd.apk{background:var(--g)}.bd.folder{background:#8b5cf6}
.tool{display:inline-block;padding:.1rem .45rem;border-radius:4px;background:var(--c2);border:1px solid var(--b);font-size:.75rem}
.ok{color:var(--g);font-weight:600}.warn{color:#f59e0b;font-weight:600}.no{color:var(--t2)}
.acts{display:flex;gap:.3rem;flex-wrap:nowrap}
.em{text-align:center;padding:3rem 1rem;color:var(--t2)}
.err{margin:1rem;padding:.8rem;background:#3a1a1a;border:1px solid var(--r);border-radius:8px;color:#ffb3b3}
footer{padding:1rem;border-top:1px solid var(--b);text-align:center;font-size:.7rem;color:var(--t2)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1500}
.mbg.s{display:flex}
.md{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:1.2rem;width:90%;max-width:420px}
.md h3{margin-bottom:.5rem;color:var(--hd)}
.md p{color:var(--t2);font-size:.8rem;margin-bottom:.7rem;line-height:1.4}
.md input{width:100%;padding:.5rem .7rem;background:var(--inp);border:1px solid var(--b);border-radius:8px;color:var(--t);font-size:.85rem;margin-bottom:.8rem}
.md .ma{display:flex;gap:.5rem;justify-content:flex-end}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:.6rem 1.1rem;border-radius:8px;font-size:.85rem;z-index:2000;opacity:0;transition:opacity .3s;max-width:90%;text-align:center;pointer-events:none}
.toast.s{opacity:1}
</style>
</head>
<body>

<div id="sp"><div class="lg">📱</div><div class="ti">MYAPPS</div><div class="sn"></div></div>

<div class="app" id="app">
<header>
  <div><h1>📱 Мои приложения</h1><p>GitHub: vladimirgorodok</p></div>
  <div class="hb">
    <button class="btn bv" id="theme">Тема</button>
    <button class="btn bv" id="settings">Настройки</button>
    <button class="btn bp" id="refresh">Обновить</button>
  </div>
</header>
<div id="selfUpd"></div>
<div class="tabs" id="tabs"></div>
<div class="srch"><input type="text" id="srch" placeholder="Поиск по названию..."></div>
<div class="flt" id="flt"></div>
<div class="wrap"><div id="list"></div></div>
<footer>
  <p>Версия приложения: <span id="ver"></span> · Загружено: <span id="lu">—</span></p>
</footer>
</div>

<div class="mbg" id="mbg">
  <div class="md">
    <h3 id="mt"></h3>
    <p id="mx"></p>
    <input type="text" id="mi" autocomplete="off">
    <div class="ma">
      <button class="btn bv" id="mc">Отмена</button>
      <button class="btn br" id="mo">OK</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const OWNER = 'vladimirgorodok';
const SELF_REPO = 'myapps';
const APP_VERSION = '1.4.0';
const API = 'https://api.github.com';
const CACHE_KEY = 'myapps-cache-v2';
const INSTALLED_KEY = 'myapps-installed-v1';
const TOKEN_KEY = 'myapps-token-v1';
const THEME_KEY = 'myapps-theme-v1';
const CACHE_TTL = 60 * 60 * 1000;

const TOOLS = [
  ['OpenCode', /opencode/i],
  ['OpenChamber', /openchamber/i],
  ['Teable', /teable/i],
  ['Claude', /claude/i],
  ['Capacitor', /capacitor/i],
  ['React', /react/i],
  ['Vite', /vite/i],
  ['Python', /python/i],
  ['Kotlin', /kotlin/i],
  ['Android Studio', /android/i],
];

const MARK_KEY = 'myapps-marks-v1';
const MARKS = { '': '—', heart: '❤️', question: '❓' };
const S = { items: [], tab: 'all', q: '', tool: '', mark: '', installed: null };

function nativeApps() {
  return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.InstalledApps;
}
function b64utf8(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
}
function bareVersion(v) {
  return String(v ?? '').replace(/^v/, '');
}
const TABS = [['all', 'Все'], ['apk', 'APK'], ['folder', 'Папки без APK']];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(s) {
  if (!s) return '—';
  const d = new Date(s);
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('s');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('s'), 2600);
}
function isNewer(a, b) {
  const x = String(a).replace(/^v/, '').split('.').map(Number);
  const y = String(b).replace(/^v/, '').split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    if ((x[i] || 0) > (y[i] || 0)) return true;
    if ((x[i] || 0) < (y[i] || 0)) return false;
  }
  return false;
}
function store(key, fallback) {
  return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
}
function detectTool(r) {
  const text = [r.name, r.description || '', ...(r.topics || []), r.language || ''].join(' ');
  const hit = TOOLS.find(([, re]) => re.test(text));
  return hit ? hit[0] : (r.language || '—');
}

async function gh(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw new Error('GitHub ' + r.status + ' ' + path);
  return r.json();
}

async function loadRepos(force) {
  const cached = store(CACHE_KEY, null);
  if (!force && cached && Date.now() - cached.t < CACHE_TTL) return cached;
  const repos = await gh(`/users/${OWNER}/repos?per_page=100&sort=updated`);
  const items = await Promise.all(repos.filter(r => !r.fork).map(async r => {
    let rel = null, root = [];
    try { rel = await gh(`/repos/${OWNER}/${r.name}/releases/latest`); } catch (e) {}
    try { root = await gh(`/repos/${OWNER}/${r.name}/contents`); } catch (e) {}
    const files = Array.isArray(root) ? root : [];
    const names = files.map(f => f.name.toLowerCase());
    const asset = rel && rel.assets ? rel.assets.find(a => a.name.toLowerCase().endsWith('.apk')) : null;
    const rootApk = files.find(f => f.name.toLowerCase().endsWith('.apk'));
    let platform = 'folder';
    if (asset || rootApk) platform = 'apk';
    let packageName = null;
    if (platform === 'apk') {
      for (const f of ['android/app/build.gradle', 'android/app/build.gradle.kts']) {
        try {
          const g = await gh(`/repos/${OWNER}/${r.name}/contents/${f}`);
          const m = b64utf8(g.content).match(/applicationId\s*=?\s*["']([\w.]+)["']/);
          if (m) { packageName = m[1]; break; }
        } catch (e) {}
      }
    }
    return {
      name: r.name,
      url: r.html_url,
      created: r.created_at,
      source: detectTool(r),
      version: rel ? rel.tag_name : '—',
      versionDate: rel ? rel.published_at : r.pushed_at,
      platform,
      packageName,
      apkUrl: asset ? asset.browser_download_url : (rootApk ? rootApk.download_url : null),
    };
  }));
  const data = { t: Date.now(), items };
  localStorage.setItem(CACHE_KEY, JSON.stringify(data));
  return data;
}

async function checkSelf() {
  const box = document.getElementById('selfUpd');
  box.innerHTML = '<div class="upd"><span>Проверка обновлений…</span></div>';
  try {
    const rel = await gh(`/repos/${OWNER}/${SELF_REPO}/releases/latest`);
    const asset = rel.assets.find(a => a.name.toLowerCase().endsWith('.apk'));
    if (!asset) {
      box.innerHTML = `<div class="upd"><span>В релизе ${esc(rel.tag_name)} нет APK-файла.</span></div>`;
    } else if (isNewer(rel.tag_name, APP_VERSION)) {
      box.innerHTML =
        `<div class="upd"><span>Доступна новая версия: <b>${esc(rel.tag_name)}</b> (сейчас ${APP_VERSION})</span>` +
        `<button class="btn bg" data-apk="${esc(asset.browser_download_url)}">Скачать и установить</button></div>`;
    } else {
      box.innerHTML = `<div class="upd"><span>Установлена последняя версия: ${APP_VERSION}</span></div>`;
    }
  } catch (e) {
    const none = /404/.test(e.message);
    box.innerHTML = `<div class="upd"><span>${none
      ? 'В репозитории пока нет релиза с APK, обновления не проверить.'
      : 'Не удалось проверить обновления: ' + esc(e.message) + '.'}</span></div>`;
  }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

function statusOf(a) {
  if (a.platform !== 'apk') return null;
  if (S.installed && a.packageName) {
    const v = S.installed[a.packageName];
    if (v == null) return { state: 'none' };
    if (bareVersion(v) === bareVersion(a.version)) return { state: 'ok', v };
    return { state: 'old', v };
  }
  return store(INSTALLED_KEY, {})[a.name] === a.version ? { state: 'ok', v: a.version } : { state: 'none' };
}

async function checkInstalled() {
  const plugin = nativeApps();
  if (!plugin) return;
  const packages = S.items.map(a => a.packageName).filter(Boolean);
  try {
    const res = await plugin.getVersions({ packages });
    S.installed = res;
  } catch (e) {
    S.installed = null;
  }
  render();
}

function render() {
  const el = document.getElementById('list');
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) => {
    const n = k === 'all' ? S.items.length : S.items.filter(a => a.platform === k).length;
    return `<button class="tb ${S.tab === k ? 'a' : ''}" data-tab="${k}">${label} (${n})</button>`;
  }).join('');

  const q = S.q.toLowerCase();
  const marks = store(MARK_KEY, {});
  const tools = [...new Set(S.items.map(a => a.source))].sort();
  document.getElementById('flt').innerHTML =
    `<label>Инструмент <select id="fTool"><option value="">Все</option>${tools.map(t => `<option ${S.tool === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>` +
    `<label>Отметка <select id="fMark">${Object.entries(MARKS).map(([k, v]) => `<option value="${k}" ${S.mark === k ? 'selected' : ''}>${v === '—' ? 'Любая' : v + (k === 'heart' ? ' Нравится' : ' Вопрос')}</option>`).join('')}</select></label>`;
  const rows = S.items.filter(a =>
    (S.tab === 'all' || a.platform === S.tab) &&
    (!q || a.name.toLowerCase().includes(q)) &&
    (!S.tool || a.source === S.tool) &&
    (!S.mark || (marks[a.name] || '') === S.mark)
  );
  if (!rows.length) {
    el.innerHTML = '<div class="em">Ничего не найдено</div>';
    return;
  }
  el.innerHTML = `<table>
    <thead><tr>
      <th>Название</th><th>Создано в</th><th>Дата создания</th><th>Дата последней версии</th>
      <th>Номер версии</th><th>Установлено на этом устройстве</th><th>Отметка</th><th>Действия</th>
    </tr></thead>
    <tbody>${rows.map(a => {
      const i = S.items.indexOf(a);
      const inst = statusOf(a);
      const status = a.platform !== 'apk' ? '<span class="no">—</span>'
        : !inst || inst.state === 'none' ? '<span class="no">Нет</span>'
        : inst.state === 'ok' ? `<span class="ok">Установлено ${esc(bareVersion(inst.v))}</span>`
        : `<span class="warn">Установлено ${esc(bareVersion(inst.v))}, есть ${esc(bareVersion(a.version))}</span>`;
      let main = '';
      if (a.platform === 'apk') main = `<button class="btn bg" data-act="install" data-i="${i}" ${a.apkUrl ? '' : 'disabled'}>Скачать и установить</button>`;
      return `<tr>
        <td class="nm">${esc(a.name)}<span class="bd ${a.platform}">${a.platform === 'apk' ? 'APK' : 'Папка'}</span></td>
        <td><span class="tool">${esc(a.source)}</span></td>
        <td>${fmt(a.created)}</td>
        <td>${fmt(a.versionDate)}</td>
        <td>${esc(a.version)}</td>
        <td>${status}</td>
        <td><select data-mark="${esc(a.name)}">${Object.entries(MARKS).map(([k, v]) => `<option value="${k}" ${(marks[a.name] || '') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
        <td><div class="acts">${main}<button class="btn bv" data-act="go" data-i="${i}">Перейти</button><button class="btn br" data-act="delete" data-i="${i}">Удалить папку (ветку)</button></div></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function ask({ title, text, placeholder = '', okText = 'OK', okClass = 'bp', value = null }) {
  return new Promise(resolve => {
    const bg = document.getElementById('mbg');
    const input = document.getElementById('mi');
    document.getElementById('mt').textContent = title;
    document.getElementById('mx').textContent = text;
    input.value = value ?? '';
    input.placeholder = placeholder;
    input.style.display = value === null ? 'none' : 'block';
    const ok = document.getElementById('mo');
    ok.textContent = okText;
    ok.className = 'btn ' + okClass;
    bg.classList.add('s');
    if (value !== null) input.focus();
    const done = res => {
      bg.classList.remove('s');
      ok.onclick = cancel.onclick = null;
      resolve(res);
    };
    const cancel = document.getElementById('mc');
    ok.onclick = () => done(value === null ? true : input.value.trim());
    cancel.onclick = () => done(null);
  });
}

async function installApk(a) {
  if (!a.apkUrl) return;
  window.open(a.apkUrl, '_blank', 'noopener');
  if (nativeApps()) {
    toast('После установки вернитесь в приложение, статус обновится.');
    return;
  }
  toast('Скачивание APK открыто. После установки отметьте приложение.');
  setTimeout(async () => {
    const yes = await ask({ title: 'Установка', text: `Приложение «${a.name}» установлено на этом устройстве?`, okText: 'Да', okClass: 'bg' });
    if (!yes) return;
    const m = store(INSTALLED_KEY, {});
    m[a.name] = a.version;
    localStorage.setItem(INSTALLED_KEY, JSON.stringify(m));
    render();
  }, 1500);
}

async function deleteRepo(a) {
  const copied = await copyText(a.name);
  let token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    toast((copied ? `Название «${a.name}» скопировано. ` : '') + 'Сначала укажите токен GitHub в «Настройки».');
    return;
  }
  const typed = await ask({
    title: 'Удалить папку (ветку)?',
    text: `Название «${a.name}» ${copied ? 'скопировано в буфер обмена. ' : ''}Репозиторий будет удалён на GitHub вместе со всем содержимым. Это нельзя отменить. Вставьте или введите название для подтверждения.`,
    placeholder: a.name, okText: 'Удалить', okClass: 'br', value: ''
  });
  if (typed === null || typed === false) return;
  if (typed !== a.name) { toast('Название не совпало. Удаление отменено.'); return; }
  try {
    const r = await fetch(`${API}/repos/${OWNER}/${a.name}`, {
      method: 'DELETE',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28' }
    });
    if (r.status === 204) {
      const cached = store(CACHE_KEY, null);
      if (cached) {
        cached.items = cached.items.filter(x => x.name !== a.name);
        localStorage.setItem(CACHE_KEY, JSON.stringify(cached));
      }
      S.items = S.items.filter(x => x.name !== a.name);
      render();
      toast(`«${a.name}» удалён.`);
    } else if (r.status === 403 || r.status === 404) {
      toast('Нет прав на удаление. Токену нужны права delete_repo (classic) или Administration: write.');
    } else {
      toast('GitHub вернул ошибку ' + r.status + '.');
    }
  } catch (e) {
    toast('Нет связи с GitHub.');
  }
}

async function openSettings() {
  const cur = localStorage.getItem(TOKEN_KEY) || '';
  const t = await ask({
    title: 'Токен GitHub',
    text: 'Нужен только для кнопки «Удалить папку (ветку)». Токен хранится на этом телефоне. Классический токен с правом delete_repo или fine-grained токен с Administration: Read and write. Оставьте поле пустым, чтобы удалить токен.',
    placeholder: 'ghp_…', okText: 'Сохранить', okClass: 'bp', value: cur
  });
  if (t === null || t === false) return;
  if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY);
  toast(t ? 'Токен сохранён.' : 'Токен удалён.');
}

function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}
function toggleTheme() {
  const light = document.documentElement.dataset.theme === 'light';
  const next = light ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next === 'light' ? 'light' : null);
}

document.addEventListener('click', e => {
  const upd = e.target.closest('[data-apk]');
  if (upd) { window.open(upd.dataset.apk, '_blank', 'noopener'); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const a = S.items[Number(btn.dataset.i)];
  if (!a) return;
  if (btn.dataset.act === 'install') installApk(a);
  if (btn.dataset.act === 'go') window.open(a.url, '_blank', 'noopener');
  if (btn.dataset.act === 'delete') deleteRepo(a);
});
async function load(force) {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="em">Загрузка из GitHub…</div>';
  try {
    const data = await loadRepos(force);
    S.items = data.items;
    document.getElementById('lu').textContent = new Date(data.t).toLocaleString('ru-RU');
    render();
    checkInstalled();
  } catch (e) {
    list.innerHTML = `<div class="err">Не удалось загрузить список из GitHub: ${esc(e.message)}. Проверьте интернет или попробуйте позже.</div>`;
  }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) checkInstalled(); });
document.getElementById('srch').addEventListener('input', e => { S.q = e.target.value; render(); });
document.addEventListener('change', e => {
  if (e.target.id === 'fTool') { S.tool = e.target.value; render(); }
  if (e.target.id === 'fMark') { S.mark = e.target.value; render(); }
  if (e.target.dataset.mark !== undefined) {
    const m = store(MARK_KEY, {});
    if (e.target.value) m[e.target.dataset.mark] = e.target.value; else delete m[e.target.dataset.mark];
    localStorage.setItem(MARK_KEY, JSON.stringify(m));
    render();
  }
});
document.getElementById('refresh').addEventListener('click', () => { load(true); checkSelf(); });
document.getElementById('settings').addEventListener('click', openSettings);
document.getElementById('theme').addEventListener('click', toggleTheme);
document.getElementById('ver').textContent = APP_VERSION;
applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : null);

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('sp').classList.add('h');
    setTimeout(() => {
      document.getElementById('sp').style.display = 'none';
      document.getElementById('app').classList.add('v');
      load(false);
      checkSelf();
    }, 500);
  }, 1000);
});
</script>
</body>
