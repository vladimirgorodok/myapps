<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>Мои приложения — MyApps</title>
<style>
:root{--p:#6366f1;--pd:#4f46e5;--bg:#0f0f23;--c:#1a1a2e;--c2:#22223d;--t:#e8e8f0;--t2:#8a8ab0;--g:#22c55e;--r:#ef4444;--bl:#3b82f6;--b:#3a3a5a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}
#sp{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#sp.h{opacity:0;pointer-events:none}
#sp .lg{font-size:4rem;animation:pu 1.4s ease-in-out infinite}
#sp .ti{margin-top:.6rem;font-size:1.5rem;font-weight:700;color:#c7c9ff;letter-spacing:.1em}
#sp .sn{width:40px;height:40px;margin-top:1.5rem;border:3px solid rgba(99,102,241,.3);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.app{display:none}.app.v{display:block}
header{padding:1rem;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
header h1{font-size:1.2rem;color:#c7c9ff}
header p{font-size:.75rem;color:var(--t2);margin-top:.2rem}
.btn{padding:.4rem .7rem;border:none;border-radius:6px;font-size:.78rem;cursor:pointer;color:#fff;white-space:nowrap}
.bp{background:var(--p)}.bg{background:var(--g)}.bb{background:var(--bl)}.br{background:var(--r)}.bv{background:var(--b);color:var(--t)}
.btn:disabled{opacity:.5}
.tabs{padding:.5rem 1rem;display:flex;flex-wrap:wrap;gap:.3rem;border-bottom:1px solid var(--b)}
.tb{padding:.35rem .75rem;background:transparent;border:1px solid var(--b);color:var(--t2);border-radius:16px;font-size:.75rem;cursor:pointer}
.tb.a{background:var(--p);border-color:var(--p);color:#fff}
.srch{padding:.5rem 1rem}
.srch input{width:100%;padding:.5rem .8rem;background:var(--c2);border:1px solid var(--b);border-radius:16px;color:var(--t);font-size:.85rem;outline:none}
.upd{margin:.5rem 1rem 0;padding:.6rem .8rem;background:#2b2a5a;border:1px solid var(--p);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.wrap{overflow-x:auto;padding:.5rem 1rem 1.5rem}
table{width:100%;border-collapse:collapse;background:var(--c);border:1px solid var(--b);border-radius:8px;min-width:820px}
th,td{padding:.5rem .6rem;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle;font-size:.8rem}
th{background:var(--c2);color:var(--t2);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
.nm{font-weight:600}
.bd{padding:.1rem .4rem;border-radius:4px;font-size:.68rem;font-weight:700;color:#fff}
.bd.apk{background:var(--g)}.bd.pwa{background:var(--bl)}.bd.folder{background:#8b5cf6}
.ok{color:var(--g);font-weight:600}.no{color:var(--t2)}
.acts{display:flex;gap:.3rem;flex-wrap:wrap}
.em{text-align:center;padding:3rem 1rem;color:var(--t2)}
.err{margin:1rem;padding:.8rem;background:#3a1a1a;border:1px solid var(--r);border-radius:8px;color:#ffb3b3}
footer{padding:1rem;border-top:1px solid var(--b);text-align:center;font-size:.7rem;color:var(--t2)}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:.6rem 1.1rem;border-radius:8px;font-size:.85rem;z-index:2000;opacity:0;transition:opacity .3s;max-width:90%;text-align:center;pointer-events:none}
.toast.s{opacity:1}
</style>
</head>
<body>

<div id="sp"><div class="lg">📱</div><div class="ti">MYAPPS</div><div class="sn"></div></div>

<div class="app" id="app">
<header>
  <div><h1>📱 Мои приложения</h1><p>Репозиторий GitHub: vladimirgorodok</p></div>
  <button class="btn bp" id="refresh">Обновить список</button>
</header>
<div id="selfUpd"></div>
<div class="tabs" id="tabs"></div>
<div class="srch"><input type="text" id="srch" placeholder="Поиск по названию..."></div>
<div class="wrap"><div id="list"></div></div>
<footer>
  <p>Версия приложения: <span id="ver"></span> · Загружено: <span id="lu">—</span></p>
</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const OWNER = 'vladimirgorodok';
const SELF_REPO = 'myapps';
const APP_VERSION = '1.0.0';
const API = 'https://api.github.com';
const CACHE_KEY = 'myapps-cache-v1';
const INSTALLED_KEY = 'myapps-installed-v1';
const CACHE_TTL = 60 * 60 * 1000;

const S = { items: [], tab: 'all', q: '' };
const TABS = [['all', 'Все'], ['apk', 'APK'], ['pwa', 'PWA'], ['folder', 'Папки без APK и PWA']];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(s) {
  if (!s) return '—';
  const d = new Date(s);
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('s');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('s'), 2600);
}
function isNewer(a, b) {
  const x = String(a).replace(/^v/, '').split('.').map(Number);
  const y = String(b).replace(/^v/, '').split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    if ((x[i] || 0) > (y[i] || 0)) return true;
    if ((x[i] || 0) < (y[i] || 0)) return false;
  }
  return false;
}
function installedMap() {
  return JSON.parse(localStorage.getItem(INSTALLED_KEY) || '{}');
}

async function gh(path) {
  const r = await fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } });
  if (!r.ok) throw new Error('GitHub ' + r.status + ' ' + path);
  return r.json();
}

async function loadRepos(force) {
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (!force && cached && Date.now() - cached.t < CACHE_TTL) return cached;
  const repos = await gh(`/users/${OWNER}/repos?per_page=100&sort=updated`);
  const items = await Promise.all(repos.filter(r => !r.fork).map(async r => {
    let rel = null, root = [];
    try { rel = await gh(`/repos/${OWNER}/${r.name}/releases/latest`); } catch (e) {}
    try { root = await gh(`/repos/${OWNER}/${r.name}/contents`); } catch (e) {}
    const files = Array.isArray(root) ? root : [];
    const names = files.map(f => f.name.toLowerCase());
    const asset = rel && rel.assets ? rel.assets.find(a => a.name.toLowerCase().endsWith('.apk')) : null;
    const rootApk = files.find(f => f.name.toLowerCase().endsWith('.apk'));
    let platform = 'folder';
    if (asset || rootApk) platform = 'apk';
    else if (names.includes('index.html') || names.includes('manifest.webmanifest') || names.includes('manifest.json')) platform = 'pwa';
    return {
      name: r.name,
      url: r.html_url,
      created: r.created_at,
      source: (r.topics && r.topics[0]) || r.language || '—',
      version: rel ? rel.tag_name : '—',
      versionDate: rel ? rel.published_at : r.pushed_at,
      platform,
      apkUrl: asset ? asset.browser_download_url : (rootApk ? rootApk.download_url : null),
      pwaUrl: platform === 'pwa' ? `https://${OWNER}.github.io/${r.name}/` : null
    };
  }));
  const data = { t: Date.now(), items };
  localStorage.setItem(CACHE_KEY, JSON.stringify(data));
  return data;
}

async function checkSelf() {
  try {
    const rel = await gh(`/repos/${OWNER}/${SELF_REPO}/releases/latest`);
    const asset = rel.assets.find(a => a.name.toLowerCase().endsWith('.apk'));
    if (isNewer(rel.tag_name, APP_VERSION) && asset) {
      document.getElementById('selfUpd').innerHTML =
        `<div class="upd"><span>Доступна новая версия приложения: <b>${esc(rel.tag_name)}</b> (сейчас ${APP_VERSION})</span>` +
        `<a class="btn bg" href="${esc(asset.browser_download_url)}" target="_blank" rel="noopener">Скачать</a></div>`;
    }
  } catch (e) {}
}

function statusOf(a) {
  if (a.platform !== 'apk') return null;
  return installedMap()[a.name] === a.version;
}

function render() {
  const el = document.getElementById('list');
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) => {
    const n = k === 'all' ? S.items.length : S.items.filter(a => a.platform === k).length;
    return `<button class="tb ${S.tab === k ? 'a' : ''}" data-tab="${k}">${label} (${n})</button>`;
  }).join('');

  const q = S.q.toLowerCase();
  const rows = S.items.filter(a =>
    (S.tab === 'all' || a.platform === S.tab) && (!q || a.name.toLowerCase().includes(q))
  );
  if (!rows.length) {
    el.innerHTML = '<div class="em">Ничего не найдено</div>';
    return;
  }
  const idx = a => S.items.indexOf(a);
  el.innerHTML = `<table>
    <thead><tr>
      <th>Название</th><th>Создано в</th><th>Дата создания</th><th>Дата последней версии</th>
      <th>Номер версии</th><th>На этом устройстве</th><th>Действия</th>
    </tr></thead>
    <tbody>${rows.map(a => {
      const inst = statusOf(a);
      const status = a.platform !== 'apk' ? '<span class="no">—</span>'
        : inst ? '<span class="ok">Установлено</span>' : '<span class="no">Нет</span>';
      let main = '';
      if (a.platform === 'apk') main = `<button class="btn bg" data-act="install" data-i="${idx(a)}" ${a.apkUrl ? '' : 'disabled'}>Скачать и установить</button>`;
      if (a.platform === 'pwa') main = `<button class="btn bb" data-act="run" data-i="${idx(a)}">Запустить</button>`;
      return `<tr>
        <td class="nm">${esc(a.name)} <span class="bd ${a.platform}">${a.platform === 'apk' ? 'APK' : a.platform === 'pwa' ? 'PWA' : 'Папка'}</span></td>
        <td>${esc(a.source)}</td>
        <td>${fmt(a.created)}</td>
        <td>${fmt(a.versionDate)}</td>
        <td>${esc(a.version)}</td>
        <td>${status}</td>
        <td><div class="acts">${main}
          <button class="btn bv" data-act="go" data-i="${idx(a)}">Перейти</button>
          <button class="btn br" data-act="delete" data-i="${idx(a)}">Удалить папку (ветку)</button>
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function installApk(a) {
  if (!a.apkUrl) return;
  window.open(a.apkUrl, '_blank', 'noopener');
  toast('Скачивание APK открыто. После установки отметьте приложение.');
  setTimeout(() => {
    if (!confirm(`Приложение «${a.name}» установлено на этом устройстве?`)) return;
    const m = installedMap();
    m[a.name] = a.version;
    localStorage.setItem(INSTALLED_KEY, JSON.stringify(m));
    render();
  }, 1500);
}

function deleteFolder(a) {
  if (!confirm(`Удаление репозитория «${a.name}» выполняется на GitHub. Открыть страницу настроек репозитория?`)) return;
  window.open(a.url + '/settings', '_blank', 'noopener');
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const a = S.items[Number(btn.dataset.i)];
  if (!a) return;
  if (btn.dataset.act === 'install') installApk(a);
  if (btn.dataset.act === 'run') window.open(a.pwaUrl, '_blank', 'noopener');
  if (btn.dataset.act === 'go') window.open(a.url, '_blank', 'noopener');
  if (btn.dataset.act === 'delete') deleteFolder(a);
});

async function load(force) {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="em">Загрузка из GitHub…</div>';
  try {
    const data = await loadRepos(force);
    S.items = data.items;
    document.getElementById('lu').textContent = new Date(data.t).toLocaleString('ru-RU');
    render();
  } catch (e) {
    list.innerHTML = `<div class="err">Не удалось загрузить список из GitHub: ${esc(e.message)}. Проверьте интернет или попробуйте позже.</div>`;
  }
}

document.getElementById('srch').addEventListener('input', e => { S.q = e.target.value; render(); });
document.getElementById('refresh').addEventListener('click', () => { load(true); checkSelf(); });
document.getElementById('ver').textContent = APP_VERSION;

window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('sp').classList.add('h');
    setTimeout(() => {
      document.getElementById('sp').style.display = 'none';
      document.getElementById('app').classList.add('v');
      load(false);
      checkSelf();
    }, 500);
  }, 1000);
});
</script>
</body>
</html>
