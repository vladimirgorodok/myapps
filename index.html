<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои приложения - MyApps</title>
  <link rel="icon" href="/vite-assets/icons.svg" type="image/svg+xml">
  <link rel="manifest" href="/web/manifest.webmanifest">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description"="Table of My Applications">
  <link rel="stylesheet" href="/src/index.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <h1>📱 Мои приложения</h1>
        <p>Таблица моих APK и PWA приложений</p>
      </div>
      <div class="header-right">
        <span id="app-version" class="app-version">Версия: loading...</span>
        <button class="btn-check-updates" onclick="checkForUpdates()">Проверить обновления</button>
      </div>
    </header>
    
    <section class="app-tabs">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="all">Все</button>
        <button class="tab-btn" data-tab="apk">APK приложения</button>
        <button class="tab-btn" data-tab="pwa">PWA приложения</button>
        <button class="tab-btn" data-tab="folders">Папки без APK/PWA</button>
      </div>
    </section>
    
    <section class="app-search">
      <input type="text" id="search-input" placeholder="Поиск приложений..." class="search-input">
      <button class="search-clear" id="search-clear" style="display:none;">×</button>
    </section>
    
    <main class="app-main">
      <div id="apps-container" class="apps-container">
        <!-- Apps will be rendered here -->
      </div>
    </main>
    
    <footer class="app-footer">
      <p>Последнее обновление: <span id="last-update">just now</span></p>
      <p>© 2026 MyApps. Все права защищены.</p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
